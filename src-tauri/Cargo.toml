[package]
name = "fix-storage-gui"
version = "0.2.3"
description = "Tauri GUI for fix-storage with AI review via Sign in with ChatGPT"
authors = ["konaito"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fix_storage_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
futures-util = "0.3"
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
url = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# キーチェーンの項目の列挙（keyring には列挙の API が無い）。keyring と同じ版。
security-framework = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# アプリ内アップデート（https://v2.tauri.app/plugin/updater/）と更新後の再起動
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
