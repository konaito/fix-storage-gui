name: Release

# v* タグの push で GitHub Release を作り、universal の .dmg を添付する。
# Developer ID で署名して公証する。署名・公証の Secrets が1つでも欠けていたら、ビルドの前に止める。
# あわせてアプリ内アップデート用の署名付き更新バンドル（.app.tar.gz と .sig）と latest.json を Release に載せる。
# Release はドラフトで作り、latest.json を検査してから公開する（検査で落ちたら、利用者には何も配られない）。
# 参考: https://v2.tauri.app/distribute/pipelines/github/ 、https://v2.tauri.app/distribute/sign/macos/ 、https://v2.tauri.app/plugin/updater/
on:
  push:
    tags: ['v*']

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_PRIVATE_KEY != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      # bundle.createUpdaterArtifacts が true なので、更新バンドルの署名鍵が無いとビルドが失敗する。先に分かりやすく止める。
      - name: Check updater signing key
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::error::Secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD がありません（README の「アプリ内アップデート」を参照）"
            exit 1
          fi

      # 署名者の違う未公証の .app が latest.json 経由で配られると、公証済みの版を使っている人のアプリ内アップデートで置き換わる。
      # そのため ad-hoc 署名や署名のみでは出さず、Secrets が欠けていたら止める。
      - name: Check Apple signing and notarization secrets
        run: |
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::error::Secrets APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD がありません（README の「公証の有効化手順」を参照）"
            exit 1
          fi
          if [ "$HAS_NOTARIZATION" != "true" ]; then
            echo "::error::Secrets APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_PRIVATE_KEY がありません（README の「公証の有効化手順」を参照）"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # ---- 署名（手順は Tauri 公式の GitHub Actions 例のとおり） ----
      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Use Developer ID signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then echo "::error::Developer ID Application certificate not found"; exit 1; fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          echo "Certificate imported."

      # ---- 公証（App Store Connect API。APPLE_API_KEY_PATH は秘密鍵ファイルのパス） ----
      - name: Prepare App Store Connect API key for notarization
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 変更点（PR 一覧）は GitHub の自動生成ノートから。アプリ内アップデートの画面には、この部分だけを出す
          # （<!-- updater-notes-end --> より前。src/lib/updater.ts の extractNotes）。
          CHANGES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body 2>/dev/null || true)
          if [ -z "$CHANGES" ]; then CHANGES="（変更点の自動生成に失敗しました。コミット履歴を参照してください）"; fi
          STATUS="この .dmg は Developer ID で署名し、Apple の公証（notarization）を通しています。"
          HOWTO="ダウンロードした .dmg を開き、Fix Storage GUI.app を「アプリケーション」へドラッグしてください。"
          {
            echo "body<<NOTES_EOF"
            echo "### ${GITHUB_REF_NAME} の変更点"
            echo
            echo "$CHANGES"
            echo
            echo "<!-- updater-notes-end -->"
            echo
            echo "## Fix Storage GUI ${GITHUB_REF_NAME}（macOS universal: Apple Silicon / Intel）"
            echo
            echo "$STATUS"
            echo
            echo "### 開き方"
            echo "$HOWTO"
            echo
            echo "すでに v0.2.0 以降を使っている場合は、アプリ内の「アップデートを確認」から更新できます（v0.1.x からは手動で入れ替えてください）。"
            echo
            echo "AI 判定には Sign in with ChatGPT（プレビュー）を使います。対象条件やプライバシーについては README を参照してください。"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新バンドル（.app.tar.gz）を minisign で署名する鍵。公開鍵は tauri.conf.json の plugins.updater.pubkey。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Fix Storage GUI ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          # ドラフトで作り、下の Verify latest.json が通ってから Publish release で公開する。
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: 'fix-storage-gui_[version]_[arch][ext]'
          args: '--target universal-apple-darwin --bundles app,dmg'
          # universal の更新バンドルを darwin-aarch64 / darwin-x86_64 の両方に載せた latest.json を作って添付する（tauri-action 標準機能）。
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      # アプリは https://github.com/<repo>/releases/latest/download/latest.json を見に来る。公開する前に、ドラフトの中身を確かめる。
      # gh release download はタグ名でドラフトも引ける（gh の FetchRelease が公開済みとドラフトの両方を探す）。
      - name: Verify latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json -D "$RUNNER_TEMP/updater" --clobber
          node - "$RUNNER_TEMP/updater/latest.json" "${GITHUB_REF_NAME#v}" <<'JS'
          const [file, want] = process.argv.slice(2);
          const j = JSON.parse(require('fs').readFileSync(file, 'utf8'));
          const fail = (m) => { console.log(`::error::latest.json: ${m}`); process.exit(1); };
          if (String(j.version).replace(/^v/, '') !== want) fail(`version ${j.version} != ${want}`);
          for (const k of ['darwin-aarch64', 'darwin-x86_64']) {
            const p = j.platforms?.[k];
            if (!p?.url || !p?.signature) fail(`${k} の url / signature がありません`);
            console.log(`${k}: ${p.url}`);
          }
          console.log('latest.json OK');
          JS

      # 検査が通ってから公開する。アプリが読むのは releases/latest なので、--latest で Latest にする。
      # ここまでで落ちたときは、ドラフトの Release が残るだけで利用者には配られない（README の「リリースの出し方」を参照）。
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
