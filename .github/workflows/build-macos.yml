name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build universal .app and .dmg (unsigned)
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: List bundles
        run: ls -la src-tauri/target/universal-apple-darwin/release/bundle/dmg src-tauri/target/universal-apple-darwin/release/bundle/macos
      - uses: actions/upload-artifact@v4
        with:
          name: fix-storage-gui-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
